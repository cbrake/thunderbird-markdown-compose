<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Markdown preview</title>
    <style>
      body {
        width: 42em;
        max-height: 34em;
        overflow-y: auto;
        margin: 0;
        padding: 1em;
      }
      #message {
        color: #57606a;
        font-family: sans-serif;
      }
      #quoted-label {
        margin: 1.5em 0 0.5em;
        padding-top: 1em;
        border-top: 1px solid #d0d7de;
        color: #57606a;
        font-family: sans-serif;
        font-size: 0.9em;
      }
      #quoted iframe {
        width: 100%;
        height: 14em;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="message"></div>
    <div id="preview"></div>
    <div id="quoted-label" hidden>Quoted message and signature, sent unchanged</div>
    <div id="quoted"></div>
    <script src="../vendor/markdown-it.min.js"></script>
    <script src="style.js"></script>
    <script src="render.js"></script>
    <script src="source.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
