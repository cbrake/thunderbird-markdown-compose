<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Markdown preview</title>
    <style>
      body {
        width: 42em;
        max-height: 34em;
        overflow-y: auto;
        margin: 0;
        padding: 1em;
      }
      #message {
        color: #57606a;
        font-family: sans-serif;
      }
      iframe.pass-through {
        display: block;
        width: 100%;
        height: 14em;
        margin: 0.5em 0;
        border: 1px solid #d0d7de;
        border-radius: 4px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="message"></div>
    <div id="preview"></div>
    <script src="../vendor/markdown-it.min.js"></script>
    <script src="style.js"></script>
    <script src="render.js"></script>
    <script src="source.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
